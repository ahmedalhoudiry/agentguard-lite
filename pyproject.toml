[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-lite"
version = "0.1.0"
description = "A small default-deny policy gate for Python agent tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
include = ["agentguard_lite*"]
